name: sync-plugin-index

# 定时从**上游插件仓库**拉取最新 commit，把新版本并入 plugin-market.json 并提交回本仓库。
#
# 为什么是「拉」而不是让上游「推」：上游在 Gitee，本索引在 GitHub，
# 用 GitHub 托管 runner 主动去读上游是最省事、也不需要在上游放任何凭据的做法。
# 可达性已实测（见 docs/ci-sync.md 的「探针结论」）。
#
# 检测源与安装来源分开（`detect_repo`）：
# - 上游主仓库在 Gitee；另有 commit 完全一致的 GitHub 镜像 `iJetLi/dsh-providers-hub`。
# - **检测**默认走 GitHub 镜像（API 更稳，见 docs/ci-sync.md），
#   **安装来源**仍写 `repo`（Gitee），历史条目一字不改。
# - 两个地址必须指向同一份代码；镜像落后会让索引钉到旧 commit 上。
#   镜像是否最新由**镜像仓库自己**的 workflow 保证（见 docs/ci-sync.md「镜像同步」）。
#
# 触发：
# - schedule：每 10 分钟一次，但**错开整点对齐**（:03/:13/:23/:33/:43/:53）。
#   官方文档明确：`schedule` 在高负载时会延迟，负载足够高时**排队任务会被丢弃**，
#   而「整点（start of every hour）」正是高负载时段，并建议避开整点的对齐槽位。
#   用 `*/10` 会精确落在 :00/:10/:20… 这些最拥挤的槽位，故写成显式列表。
# - repository_dispatch：**事件驱动唤醒**，由 `gitMFQ/dsh-providers-hub`（镜像的 fork）
#   在发现上游有新 commit 时发 `wake-index` 事件触发。cron 会被限流、可能延迟数小时，
#   这条路径不受 schedule 限流影响，是「上游一推、索引就跟」的主通道。
#   见 docs/ci-sync.md 的「事件驱动唤醒」。
# - workflow_dispatch：手动，可临时换上游仓库或关掉「同版本重定 commit」。
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  repository_dispatch:
    types: [wake-index]
  workflow_dispatch:
    inputs:
      repo:
        description: 安装来源仓库地址（留空用默认；写进索引的 source.url）
        required: false
        default: ''
      detect_repo:
        description: 检测源仓库地址（留空用 GitHub 镜像；须与安装来源 commit 一致）
        required: false
        default: ''
      no_repin:
        description: 版本号未变时不重定 commit
        required: false
        type: boolean
        default: false
      commit_version:
        description: 把 commit 编进版本号，让「只改代码没抬版本号」也能点升级（开一次即长期有效，抬版本号也带）
        required: false
        type: choice
        default: 自动
        options:
          - 自动
          - 关闭
          - prerelease
          - build

# 需要写权限才能把同步结果推回本仓库。
permissions:
  contents: write

# 同一时刻只跑一个同步，避免两个 run 抢着 push。
concurrency:
  group: sync-plugin-index
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出索引仓库
        uses: actions/checkout@v5

      - name: 准备 Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 安装官方索引校验器
        run: npm install --no-audit --no-fund

      - name: 读取上游最新 commit 并更新索引
        id: sync
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_DETECT_REPO: ${{ inputs.detect_repo }}
          INPUT_NO_REPIN: ${{ inputs.no_repin }}
          # 定时触发时 inputs 为空字符串；「自动」= 沿用索引最新条目已有的形态（粘性），不传开关。
          INPUT_COMMIT_VERSION: ${{ inputs.commit_version }}
        run: |
          # 安装来源：默认 Gitee 主仓库（写进索引的 source.url，历史条目不变）。
          args=(--out plugin-market.json --require-validator)
          args+=(--repo "${INPUT_REPO:-https://gitee.com/iJetLi/deepseek-harness-codearts}")
          # 检测源：默认 GitHub 镜像（commit 与 Gitee 一致，API 更稳）。
          args+=(--detect-repo "${INPUT_DETECT_REPO:-https://github.com/iJetLi/dsh-providers-hub}")
          if [ "$INPUT_NO_REPIN" = "true" ]; then args+=(--no-repin); fi
          # 自动 = 不加 --commit-version（由脚本按索引最新条目决定是否沿用合成形态）。
          case "$INPUT_COMMIT_VERSION" in
            prerelease|build) args+=(--commit-version "$INPUT_COMMIT_VERSION") ;;
            关闭) args+=(--commit-version never) ;;
          esac
          node scripts/update-index.mjs "${args[@]}"

      - name: 复核写出的索引
        run: node scripts/validate-index.mjs --out plugin-market.json

      - name: 提交并推送
        if: steps.sync.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.sync.outputs.version }}
          ACTION: ${{ steps.sync.outputs.action }}
          COMMIT: ${{ steps.sync.outputs.commit }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin-market.json
          git commit -m "chore(index): 同步 dsh-providers-hub@${VERSION}（${ACTION}，commit ${COMMIT:0:7}）"
          git push

      - name: 汇总
        env:
          VERSION: ${{ steps.sync.outputs.version }}
          ACTION: ${{ steps.sync.outputs.action }}
          CHANGED: ${{ steps.sync.outputs.changed }}
          COMMIT: ${{ steps.sync.outputs.commit }}
        run: |
          {
            echo "### 插件索引同步"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游最新版本 | \`${VERSION}\` |"
            echo "| 上游最新 commit | \`${COMMIT}\` |"
            echo "| 版本条目动作 | \`${ACTION}\` |"
            echo "| 索引是否变化 | \`${CHANGED}\` |"
            echo
            echo "> 检测源与安装来源不同时，请核对两者 commit 一致（见 docs/ci-sync.md）。"
          } >> "$GITHUB_STEP_SUMMARY"
